<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title></title>
    <meta name="description" content="">
    <meta name="keywords" content="" />
    <meta name="robots" content="index, follow" />
    <!-- Relative URLs resolve to the current host (multitenant / IDN) -->
    <link rel="canonical" href="/" />
    <meta property="og:url" content="/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="">
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: #1f2937;
      }
    </style>
    <script>
      (function () {
        var host = (location.hostname || '').replace(/^www\./i, '').toLowerCase();
        var isEn = host === 'en' || host.indexOf('en.') === 0;
        document.documentElement.lang = isEn ? 'en' : 'ru';
        var og = document.querySelector('meta[property="og:locale"]');
        if (og) {
          og.setAttribute('content', isEn ? 'en_US' : 'ru_RU');
        }
        function setMeta(attr, name, content) {
          var el = document.querySelector('meta[' + attr + '="' + name + '"]');
          if (el) el.setAttribute('content', content);
        }
        function removeMeta(attr, name) {
          var el = document.querySelector('meta[' + attr + '="' + name + '"]');
          if (el) el.parentNode.removeChild(el);
        }
        function setFavicon(href) {
          var url = String(href || '').trim() || '/favicon.ico';
          var links = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]');
          var i;
          if (links.length) {
            for (i = 0; i < links.length; i++) {
              links[i].setAttribute('href', url);
              if (url.indexOf('.png') !== -1 || url.indexOf('/uploads/') !== -1) {
                links[i].setAttribute('type', 'image/png');
              } else if (url.indexOf('.ico') !== -1) {
                links[i].setAttribute('type', 'image/x-icon');
              }
            }
            return;
          }
          var link = document.createElement('link');
          link.setAttribute('rel', 'icon');
          link.setAttribute('href', url);
          document.head.appendChild(link);
        }
        function applyCustom(data) {
          var desc = String((data && data.domainDescription) || '').trim();
          var title = desc.slice(0, 120);
          var siteName = (desc.split(/\s+[—–-]\s+/)[0] || desc).slice(0, 80);
          document.title = title;
          setMeta('name', 'description', desc);
          setMeta('property', 'og:description', desc);
          setMeta('name', 'twitter:description', desc);
          setMeta('property', 'og:title', title);
          setMeta('name', 'twitter:title', title);
          setMeta('property', 'og:site_name', siteName);
          if (data && data.hideOgImage) {
            removeMeta('property', 'og:image');
            removeMeta('name', 'twitter:image');
            setMeta('name', 'twitter:card', 'summary');
            setFavicon('/favicon.ico');
          } else {
            var img = String((data && data.ogImageUrl) || '').trim() || '/og-default.png';
            setMeta('property', 'og:image', img);
            setMeta('name', 'twitter:image', img);
            setMeta(
              'name',
              'twitter:card',
              img !== '/og-default.png' ? 'summary_large_image' : 'summary'
            );
            setFavicon(img);
          }
        }
        fetch('/api/settings/sidebar-notice')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (json) {
            if (!json || !json.data) return;
            applyCustom(json.data);
          })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; color: #1f2937;">
        <h1>JavaScript is required</h1>
        <p>Please enable JavaScript in your browser to use this application.</p>
        <p>Для работы этого приложения необходимо включить JavaScript в вашем браузере.</p>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
